name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   goarch: amd64, asset: linux-amd64 }
          - { os: linux,   goarch: arm64, asset: linux-arm64 }
          - { os: linux,   goarch: arm,   goarm: "7", asset: linux-armv7 }
          - { os: darwin,  goarch: amd64, asset: darwin-amd64 }
          - { os: darwin,  goarch: arm64, asset: darwin-arm64 }
          - { os: windows, goarch: amd64, asset: windows-amd64 }
          - { os: windows, goarch: arm64, asset: windows-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" \
            -o "dnsproxy-scheduler-${{ matrix.asset }}${ext}" ./cmd/dnsproxy

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dnsproxy-scheduler-${{ matrix.asset }}*

# dnsproxy-router 配置示例
# 用法：复制为 config.yaml 后，把下面示例值替换成你自己的再启动。
#   cp config.example.yaml config.yaml
# 字段说明见 README。

# 是否使用域名（true 时用域名签发证书，domain 为证书域名）
use_domain: true
domain: "example.com"

# 入站监听：四种协议，各自独立开关与端口（path 仅 DoH 使用）
# 加密协议（DoH/DoT/DoQ）需要 cert 证书；明文（plain_dns）不需要。
listeners:
  doh:
    enabled: true
    port: 443
    path: "/dns-query"   # DoH 端点请求路径（可自定义，支持多层子路径）
    http3: false         # 是否同时启用 HTTP/3（QUIC/UDP，与 HTTP/2 同端口）
  dot:
    enabled: false
    port: 853
  doq:
    enabled: false
    port: 853
  plain_dns:             # 明文 DNS，同时监听 UDP 与 TCP 同一端口
    enabled: false
    port: 53

# EDNS Client Subnet 策略
# mode: off（移除 EDNS）| pass（透传）| override（覆写为固定前缀）
# address: override 模式下的固定前缀
ecs:
  mode: "off"
  address: ""

# 证书配置
cert:
  mode: "acme"          # acme（acme.sh 申请+续期）| existing（已有证书）
  renew: true           # acme 模式下是否自动续期
  cert_path: "/etc/dnsproxy/certs/fullchain.pem"
  key_path:  "/etc/dnsproxy/certs/privkey.pem"
  email: "you@example.com"
  provider: "cloudflare"  # DNS API 提供商（acme DNS-01 用）

# 探测参数
# 时长字段单位：ns / us / ms / s / m / h / d（d=天，1d=24h），可组合如 2d12h、2d12h30m
probe_interval: 15m      # 探测周期
probe_timeout: 3s        # 单次探测超时
probe_count: 3           # 每模式探测次数（取中位数）
probe_domain: "example.com."

# 响应缓存
cache_enabled: true        # 是否开启 DNS 响应缓存（false 关闭）
cache_size_bytes: 67108864 # 缓存大小（字节），仅开启时生效
cache_ttl: 30m             # 固定过期时间（如 30m/1h）；0s 表示跟随记录自身 TTL
cache_eviction: lru        # 逐出策略：fifo（先进先出）| lru（最近最少用）| lfu（最不常用）
cache_stale_max_age: 0s    # 乐观缓存窗口：过期后仍保留旧答案的时长（如 1h/12h）；0s 不启用
cache_stale_answer_ttl: 0s # 命中旧答案时返回客户端的短 TTL；0s 用默认 30s
ttl_min: 0s                # TTL 下限钳制：低于此值拉高（如 0s 表示不设）
ttl_max: 0s                # TTL 上限钳制：高于此值压低（如 0s 表示不设）

# 解析上游主机名用的引导 DNS（明文）
bootstrap:
  - "1.1.1.1:53"
  - "8.8.8.8:53"

# 引导解析结果缓存时长（0s 表示不缓存）
bootstrap_cache_ttl: 5s

# 上游域名 → IP 静态映射：命中即直接用给定 IP，不再走引导 DNS。
# 键为上游主机名（可带或不带尾部点），值为 IP 列表（IPv4/IPv6 均可）。
# 同时配 IPv4/IPv6 时，由 ip_priority 决定优先用哪族，连接失败自动回退另一族。
hosts: {}
#  example.com:
#    - "1.2.3.4"
#    - "2001:db8::1"

# 上游域名同时有 IPv4/IPv6 时的地址族优先级：
#   ipv4    IPv4 优先（v6 作连接失败回退）
#   ipv6    IPv6 优先（v4 作连接失败回退）
#   latency 按延迟动态选族（周期探测两族延迟，选低延迟者）
ip_priority: ipv4

# 每个服务商覆盖全局 ip_priority 的优先级，键为 dns 里的服务商名；
# 未列出的服务商回退到上面的 ip_priority。
# latency 的延迟探测周期仍全局统一（ip_latency_interval）。
provider_ip_priority: {}
#  cf: latency
#  adguard: ipv6

# ip_priority 或 provider_ip_priority 中 latency 时的延迟探测周期
ip_latency_interval: 15m

# 上游查询结果的赛马模式：
#   fastest  并发查询，谁先成功返回用谁
#   weighted 加权 + 延时窗口：首个响应后窗口期内收集所有成功响应，
#            取权重最高者；权重相同时取响应最快者
upstream_mode: fastest

# weighted 模式下各服务商的权重（1-100），键为 dns 里的服务商名；
# 未列出的服务商默认权重 1。fastest 模式下忽略本段。
upstream_weights: {}
#  cf: 8
#  adguard: 20

# weighted 模式的延时窗口（首个响应后等待多久，超时响应抛弃）
race_window: 50ms

# 健康检查 HTTP 监听地址，提供 /healthz 就绪探针（选路未就绪返回 503）。
# 留空 "" 表示不启用。注意：此字段不可热重载，改动需 restart。
health_http: ""

# 上游熔断：某成员连续失败达到阈值即临时摘除、冷却后自动恢复（快速失败）。
# breaker_fail_threshold 为 0 表示禁用熔断（默认）。开启示例：
#   breaker_fail_threshold: 3
#   breaker_cooldown: 30s
breaker_fail_threshold: 0
breaker_cooldown: 0s

# DNSSEC：客户端请求带 DO 位时向上游透传 DO 位、缓存 RRSIG 等签名记录。
# 仅透传、不验证签名。false 关闭。注意：此字段不可热重载，改动需 restart。
dnssec: false

# 上游服务商 → 查询模式 → 地址
# 模式键：DNS-over-HTTPS / DNS-over-TLS / DNS-over-QUIC / Plain DNS
# 地址格式：https://host/dns-query | tls://host:853 | quic://host:853 | udp://host:53
#
# 注意：DoH 上游（https://）默认会自动尝试 HTTP/3——首次建连时并发探测
# QUIC 与 TLS，QUIC 更快且可用则走 h3，否则自动降级回 HTTP/2；连接建立后
# 复用，跨请求保持热。无需在此额外配置。
#
# 必填：在此配置你自己的上游（每个服务商可配一种或多种模式）。
# 把下面示例中的值替换成你的真实端点后取消注释：
#   provider-a:
#     DNS-over-HTTPS: "https://dns.example.com/dns-query"
#     DNS-over-TLS:   "tls://dns.example.com:853"
#     DNS-over-QUIC:  "quic://dns.example.com:853"
#     Plain DNS:      "udp://8.8.8.8:53"
dns: {}
